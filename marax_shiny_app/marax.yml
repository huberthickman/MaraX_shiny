# MaraX dashboard config

# USB serial adapter. "auto" picks the first one found; or give a path, e.g.
#   Linux: /dev/ttyUSB0  (your user needs to be in the 'dialout' group)
#   macOS: /dev/cu.usbserial-XXXX  (use cu., not tty.)
#   Windows: COM3  (see Device Manager > Ports; needs install.packages("serial"))
port: auto
window_minutes: 30       # how much history to keep in memory

# The temperature switch isn't in the serial data, so set it here.
temp_setting: "I"       # "0", "I", or "II"

# HX °C at which the machine counts as ready, per switch setting.
# Set ~1 °C below the bottom of the steady-state HX cycle: every reading in the
# last stable_minutes must be at or above it.
# Manual brew temps: 0 = 90, I = 92, II = 94 °C.
ready_hx:
  "0": 90    # estimate, not yet measured
  "I": 92    # measured: steady-state HX cycles 93-94 (2026-10-12)
  "II": 94   # estimate, not yet measured
stable_minutes: 3        # HX must hold steady this long...
stable_band: 1           # ...within this many °C (max - min)

# Ready sound (beepr): a sound number or name, e.g. 3 / "fanfare", 6 / "ready" or
# 7 / "shotgun", a path to your own .wav (e.g. /opt/marax/rooster.wav), or false for silence.
sound: 3

# Testing without the machine
simulate: true
sim_file: sample_data.tsv  # capture to replay (in the app folder); leave blank for a synthetic warm-up
sim_speed: 10              # play this many times faster than real time (1 = real time)
sim_loop: true             # start the replay again when it reaches the end
sim_mode: C                # synthetic warm-up only: C (coffee) or V (steam)

# Extra log lines in the R console (a status line every 10 s). Key events such
# as the mode, opening the replay file and errors are always logged.
debug: true