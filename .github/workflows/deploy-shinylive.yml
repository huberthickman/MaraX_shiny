# Build the MaraX dashboard with shinylive and publish it to GitHub Pages.
# Runs on every push to main (including merged pull requests), or by hand from the
# Actions tab. Requires Settings -> Pages -> Source: "GitHub Actions".
name: Deploy shinylive app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write      # to publish to Pages
  id-token: write   # to verify the deployment comes from this repo

# Only one deployment at a time; a newer push cancels an older run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false   # nothing here pushes, so don't leave the token on disk

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            any::shiny
            any::yaml
            any::later
            any::beepr

      - name: Export app with shinylive
        shell: Rscript {0}
        run: |
          # Browser tab icon: a ☕ emoji drawn as an inline SVG, so no image file
          # is needed. Percent-encoded so it survives the HTML attribute.
          favicon <- '<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20100%20100%27%3E%3Ctext%20y=%27.9em%27%20font-size=%2790%27%3E%E2%98%95%3C/text%3E%3C/svg%3E">'
          shinylive::export(
            appdir = "marax_shiny_app",
            destdir = "site",
            template_params = list(
              title = "MaraX Dashboard",   # browser tab title
              include_in_head = favicon    # browser tab icon
            )
          )

      - name: Upload site for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5