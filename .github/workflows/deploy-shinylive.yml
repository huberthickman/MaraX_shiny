# Build the MaraX dashboard with shinylive and publish it to GitHub Pages.
# Runs on every push to main (including merged pull requests), or by hand from the
# Actions tab. Requires Settings -> Pages -> Source: "GitHub Actions".
name: Deploy shinylive app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write      # to publish to Pages
  id-token: write   # to verify the deployment comes from this repo

# Only one deployment at a time; a newer push cancels an older run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            any::shiny
            any::yaml
            any::later
            any::beepr

      - name: Export app with shinylive
        shell: Rscript {0}
        run: shinylive::export(appdir = "marax_shiny_app", destdir = "site")

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4